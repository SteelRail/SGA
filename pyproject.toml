[project]
name = "sga"
version = "2026.08"
description = "DESI Legacy Survey DR9 cutouts of SGA-2020 galaxies — GRAF training data"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "astropy",
  "requests",
  "tqdm",
  "matplotlib",
]

[dependency-groups]
dev = [
  "ruff",
  "ipykernel",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# line length is owned by the formatter
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
